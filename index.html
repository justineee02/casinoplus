    document.addEventListener('click', function (event) {
        var div = document.getElementById('rb-back-dialog');
        var targetElement = event.target; // clicked element
        if (targetElement !== div && !div.contains(targetElement)) {
            // Clicked outside the div
            div.style.display = 'none';
            $('.rb-mask-show').hide()
        }
    });

    function isPC() {
        var userAgentInfo = navigator.userAgent;
        var agents = ["Android", "iPhone", "SymbianOS", "Windows Phone", "iPad", "iPod"];
        var flag = true;
        for (var i = 0; i < agents.length; i++) {
            if (userAgentInfo.indexOf(agents[i]) > 0) {
                flag = false;
                break;
            }
        }
        return flag;
    }

    function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }

    //loading
    setTimeout(function () {
        $('#loading-box').hide()
    }, 4000);
</script>

<script>
    if (isIOS()) {
        window.location.href = 'start_url.html'
    }

    //pwa
    let is_install = localStorage.getItem(storage_key)
    if (is_install) {
        $('.container').attr('data-type', 'PLAY')
        $('#loading-box').hide()
    }

    //beforeinstallprompt
    let deferredInstallPrompt = null;

    //beforeinstallprompt
    window.addEventListener('beforeinstallprompt', (event) => {
        localStorage.removeItem(storage_key);
        $('#loading-box').hide()
        $('.container').attr('data-type', 'INSTALL')

        event.preventDefault();
        deferredInstallPrompt = event;
    });

    var count = 0;
    $('.click_download').click(function () {
        $('.rb-mask-show').hide()
        var type = $('.container').attr('data-type');
        switch (type) {
            case "PLAY":
                if (isPC()) {
                    window.location.href = "web+pwa://"
                } else {
                    window.open('start_url.html', '_blank');
                }
                break;
            case "INSTALL":
                if (!deferredInstallPrompt && count === 0) {
                    $("#pop-show").show()
                    $("#pop-show .loading-ci").show()

                    var interval = setInterval(function () {
                        $('#count1').text(count++);
                        if (count == 100) {
                            $("#pop-show .loading-ci").hide()
                            $("#pop-show .show-btn").show()
                            clearInterval(interval);
                        }
                    }, 40);
                } else {
                    $("#pop-show").hide()
                    pwa_install()
                }
                break;
        }
    })
